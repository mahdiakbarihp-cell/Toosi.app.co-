<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOOSI.APP.CO | خانه</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        body {
            font-family: 'Vazirmatn', sans-serif;
            background-color: #090b0e;
            background-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.35), rgba(0, 0, 0, 0.6)), url('images/background/1000233278_2.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            margin: 0;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.16);
            transition: all 0.3s ease;
        }
        .glass-card:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.35);
            transform: translateY(-4px);
        }
    </style>
</head>
<body class="text-white flex flex-col justify-between min-h-screen">

    <header class="w-full max-w-[1100px] mx-auto mt-4 px-4">
        <nav class="flex items-center justify-between px-6 py-2.5 rounded-full bg-black/50 backdrop-blur-md border border-white/15 shadow-lg">
            <!-- سمت راست: برند (لوگو یا متن) -->
            <a href="index.html" class="flex items-center gap-2.5 text-white font-bold tracking-widest text-sm md:text-base hover:text-gray-300 transition" dir="ltr">
                <!-- در صورت قرار دادن فایل logo.png در پوشه images/logo، تصویر نمایش داده می‌شود -->
                <img src="images/logo/logo.png" alt="TOOSI.APP.CO" class="h-7 w-auto object-contain hidden" onload="this.classList.remove('hidden')" onerror="this.remove()">
                <span>TOOSI.APP.CO</span>
            </a>

            <!-- سمت چپ: لینک ها به ترتیب از چپ به راست -->
            <div class="flex items-center gap-3 md:gap-5 text-xs md:text-sm text-gray-200 overflow-x-auto whitespace-nowrap" dir="ltr">
                <a href="contact.html" class="hover:text-white transition">ارتباط با ما</a>
                <a href="app-activation.html" class="hover:text-white transition">فعال سازی برنامه ها</a>
                <a href="projects-in-development.html" class="hover:text-white transition">برنامه های در حال توسعه</a>
                <a href="custom-websites.html" class="hover:text-white transition">وب سایت ها اختصاصی</a>
                <a href="consultation-order.html" class="hover:text-white transition">مشاوره و سفارش</a>
                <a href="index.html" class="text-white font-semibold hover:text-gray-300 transition">خانه</a>
            </div>
        </nav>
    </header>

    <main class="flex-1 flex items-center justify-center px-4 py-8">
        <div class="w-full max-w-[760px] grid grid-cols-4 gap-3 md:gap-5">
            <!-- راست به چپ -->
            <a href="electrical-projects.html" class="glass-card aspect-[4/9] rounded-2xl p-3 md:p-4 flex flex-col items-center justify-start text-center group relative overflow-hidden">
                <img src="images/electrical-projects/cover.jpg" alt="" class="absolute inset-0 w-full h-full object-cover opacity-0 transition-opacity duration-300" onload="this.classList.remove('opacity-0'); this.classList.add('opacity-35', 'group-hover:opacity-50')" onerror="this.remove()">
                <div class="relative z-10 flex flex-col items-center">
                    <span class="text-xs md:text-sm font-semibold text-gray-100 group-hover:text-white leading-relaxed mt-2">
                        پروژه های برق
                    </span>
                    <div class="w-8 h-[1px] bg-white/30 mt-3 group-hover:w-12 transition-all"></div>
                </div>
            </a>

            <a href="app-projects.html" class="glass-card aspect-[4/9] rounded-2xl p-3 md:p-4 flex flex-col items-center justify-start text-center group relative overflow-hidden">
                <img src="images/app-projects/cover.jpg" alt="" class="absolute inset-0 w-full h-full object-cover opacity-0 transition-opacity duration-300" onload="this.classList.remove('opacity-0'); this.classList.add('opacity-35', 'group-hover:opacity-50')" onerror="this.remove()">
                <div class="relative z-10 flex flex-col items-center">
                    <span class="text-xs md:text-sm font-semibold text-gray-100 group-hover:text-white leading-relaxed mt-2">
                        پروژه های App
                    </span>
                    <div class="w-8 h-[1px] bg-white/30 mt-3 group-hover:w-12 transition-all"></div>
                </div>
            </a>

            <a href="design-build-projects.html" class="glass-card aspect-[4/9] rounded-2xl p-3 md:p-4 flex flex-col items-center justify-start text-center group relative overflow-hidden">
                <img src="images/design-build-projects/cover.jpg" alt="" class="absolute inset-0 w-full h-full object-cover opacity-0 transition-opacity duration-300" onload="this.classList.remove('opacity-0'); this.classList.add('opacity-35', 'group-hover:opacity-50')" onerror="this.remove()">
                <div class="relative z-10 flex flex-col items-center">
                    <span class="text-xs md:text-sm font-semibold text-gray-100 group-hover:text-white leading-relaxed mt-2">
                        پروژه های طراحی ساخت
                    </span>
                    <div class="w-8 h-[1px] bg-white/30 mt-3 group-hover:w-12 transition-all"></div>
                </div>
            </a>

            <a href="projects-in-development.html" class="glass-card aspect-[4/9] rounded-2xl p-3 md:p-4 flex flex-col items-center justify-start text-center group relative overflow-hidden">
                <img src="images/projects-in-development/cover.jpg" alt="" class="absolute inset-0 w-full h-full object-cover opacity-0 transition-opacity duration-300" onload="this.classList.remove('opacity-0'); this.classList.add('opacity-35', 'group-hover:opacity-50')" onerror="this.remove()">
                <div class="relative z-10 flex flex-col items-center">
                    <span class="text-xs md:text-sm font-semibold text-gray-100 group-hover:text-white leading-relaxed mt-2">
                        پروژه های در حال توسعه
                    </span>
                    <div class="w-8 h-[1px] bg-white/30 mt-3 group-hover:w-12 transition-all"></div>
                </div>
            </a>
        </div>
    </main>

    <footer class="text-center py-3 text-[11px] text-gray-400/70" dir="ltr">
        &copy; 2026 TOOSI.APP.CO
    </footer>
</body>
</html>
